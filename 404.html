
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Stackly Backup & Recovery</title>

    <link rel="stylesheet" href="css/404.css">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
</head>
<body>

    <main class="stackly-404">
        <div class="stackly-404-card">

            <a href="index.html" class="stackly-404-logo">
                <img src="assets/logo 4.webp" alt="Stackly">
            </a>

            <div class="stackly-404-visual">
                <span class="stackly-404-number">404</span>
                <div class="stackly-404-icon">
                    <span class="material-symbols-outlined">shield_lock</span>
                </div>
            </div>

            <span class="stackly-404-label">BACKUP &amp; RECOVERY SOLUTIONS</span>

            <h1>Page not found</h1>

            <p class="stackly-404-description">
                The page you're looking for may have been moved,
                updated, or is temporarily unavailable. Let’s get
                you back to protecting what matters.
            </p>

            <div class="stackly-404-actions">
                <a href="index.html" class="stackly-404-home">
                    <span class="material-symbols-outlined">home</span>
                    Back to Home
                </a>

                <button type="button" class="stackly-404-back" id="stacklyGoBack">
                    Go Back
                </button>
            </div>

            <div class="stackly-404-footer">
                <span class="material-symbols-outlined">verified_user</span>
                <span>Secure data. Reliable recovery. Stackly.</span>
            </div>

        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="js/404.js"></script>
</body>
</html>
